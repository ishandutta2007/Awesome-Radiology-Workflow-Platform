<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <text x="50%" y="40%" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" dominant-baseline="middle" text-anchor="middle">
    Awesome Radiology Workflow
  </text>
  <text x="50%" y="65%" font-family="Arial, sans-serif" font-size="18" fill="#E9D5FF" dominant-baseline="middle" text-anchor="middle">
    Curated SaaS &amp; Open-Source Platforms
  </text>
  <circle cx="50" cy="50" r="10" fill="#38BDF8">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="150" r="15" fill="#F472B6">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>